services:
  devin-proxy:
    image: ghcr.io/rczlin/devin-proxy:latest
    container_name: devin-proxy
    env_file: .env
    ports:
      - "127.0.0.1:8317:8317"     # drop 127.0.0.1 to expose on LAN — set DEVIN_PROXY_KEY first
    volumes:
      - ./data:/data            # persists request log + API keys + account pool
    restart: unless-stopped

# Accounts: zero needed to start. Add them in /admin -> 账号池 (OAuth login,
# manual token paste, or local import). To seed a token file instead, mount it
# and set DEVIN_SESSION_TOKEN_FILE in .env.
