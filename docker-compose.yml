services:
  devin-proxy:
    image: ghcr.io/rczlin/devin-proxy:latest
    container_name: devin-proxy
    env_file: .env
    ports:
      - "127.0.0.1:8317:8317"     # drop 127.0.0.1 to expose on LAN — set DEVIN_PROXY_KEY first
    volumes:
      - devin-proxy-data:/data    # persists request log + API keys
    restart: unless-stopped

volumes:
  devin-proxy-data:
